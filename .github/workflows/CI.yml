name: CI

# CI PROBE branch -- not for merging. The regular matrix cut down to the Linux
# jobs, with .github/probe/run-with-probe.sh wrapped around the ctest step and
# the probe's output uploaded as an artifact whether the tests pass or fail.
# Install and post-install steps are dropped: they say nothing about the flake.

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CDASH: ${{ vars.CDASH }}
  CMAKE_VERBOSE_MAKEFILE: true
  CTEST_OUTPUT_ON_FAILURE: true

jobs:
  alma9:
    name: Alma 9
    runs-on: ubuntu-latest
    container: almalinux:9

    env:
      CMAKE_ARGS: "-DCMAKE_INSTALL_PREFIX=/usr;-DCMAKE_INSTALL_RPATH='$ORIGIN/../$LIB'"

    steps:
    - name: Install dependencies
      run: |
        dnf install -y dnf-plugins-core epel-release git rpmdevtools sudo
        dnf config-manager --set-enabled crb

    - name: Clone repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup GitHub runner user within container
      run: adduser --uid 1001 runner && chown -R runner:runner ${GITHUB_WORKSPACE}

    - name: Install XRootD build dependencies
      run: dnf builddep -y xrootd.spec

    - name: Build and Test with CTest, under the probe
      run: .github/probe/run-with-probe.sh sudo -E -u runner ctest -VV -S test.cmake

    - name: Upload probe output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: probe-alma9
        path: probe/
        if-no-files-found: warn

  fedora:
    name: Fedora
    runs-on: ubuntu-latest
    container: fedora

    strategy:
      matrix:
        compiler: [ 'gcc', 'clang' ]
        config: [ 'Debug', 'Release' ]
      fail-fast: false

    env:
      CC: ${{ matrix.compiler }}
      CMAKE_ARGS: "-DCMAKE_INSTALL_PREFIX=/usr;-DCMAKE_INSTALL_RPATH='$ORIGIN/../$LIB'"
      CMAKE_BUILD_TYPE: ${{ matrix.config }}
      CMAKE_GENERATOR: Ninja

    steps:
    - name: Install dependencies
      run: dnf install -y dnf-plugins-core git ninja-build rpmdevtools ${{ matrix.compiler }}

    - name: Clone repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup GitHub runner user within container
      run: adduser --uid 1001 runner && chown -R runner:runner ${GITHUB_WORKSPACE}

    - name: Install XRootD build dependencies
      run: dnf builddep -y --define 'with_ceph 1' xrootd.spec

    - name: Build and Test with CTest, under the probe
      run: .github/probe/run-with-probe.sh sudo -E -u runner env CC=${CC} CXX=${CC/g*/g++} ctest -VV -S test.cmake

    - name: Upload probe output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: probe-fedora-${{ matrix.compiler }}-${{ matrix.config }}
        path: probe/
        if-no-files-found: warn

  ubuntu:
    name: Ubuntu

    strategy:
      matrix:
        os: [ '24.04' ]
        compiler: [ 'gcc', 'clang' ]
        config: [ 'Debug', 'Release' ]
      fail-fast: false

    runs-on: ubuntu-${{ matrix.os }}

    env:
      CC: ${{ matrix.compiler }}
      CMAKE_BUILD_TYPE: ${{ matrix.config }}
      CMAKE_ARGS: '-DINSTALL_PYTHON_BINDINGS=0;-DCMAKE_INSTALL_PREFIX=/usr'
      DEBIAN_FRONTEND: noninteractive

    steps:
    - name: Install development tools
      run: |
        sudo apt update -qq
        sudo apt install -y build-essential devscripts equivs git

    - name: Clone repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install XRootD build dependencies
      run: mk-build-deps --install --remove -s sudo debian/control <<< yes

    - name: Build and Test with CTest, under the probe
      run: .github/probe/run-with-probe.sh env CC=${CC} CXX=${CC/g*/g++} ctest -VV -S test.cmake

    - name: Upload probe output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: probe-ubuntu-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
        path: probe/
        if-no-files-found: warn
